# 智能摄像头应用配置
# 演示图像处理能力的组合

app_name: "Smart Camera MVP"

enabled_capabilities:
  - "logger"
  - "image_processor"
  - "formatter"

capability_order:
  - "logger"
  - "image_processor"
  - "formatter"

custom_settings:
  image_processor.operation: "grayscale"
  formatter.format: "titlecase"
  logger.level: "info"
