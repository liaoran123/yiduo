# Hello World 应用配置
# 配置即编程 - 修改这里就能改变应用行为！

app_name: "Hello MVP"

# 启用的能力积木
enabled_capabilities:
  - "logger"
  - "greeter"
  - "formatter"

# 能力执行顺序（流水线）
capability_order:
  - "logger"       # 第一步：记录日志
  - "greeter"      # 第二步：添加问候
  - "formatter"    # 第三步：格式化输出

# 各能力的自定义设置
custom_settings:
  greeter.greeting: "Hello"
  formatter.format: "uppercase"
  logger.level: "info"
