# 一多 OS 启动配置 - 系统内部引导文件
# 用户无需直接编辑此文件
# 组件配置请放在 configs/components/ 目录下

system:
  name: Yiduo OS MVP
  version: 0.1.0
  description: 一多操作系统最小启动器

# Wasm 运行时配置
# 用户在此选择 WAMR 实现（遵循 008 组件配置规范）
#   - wamr-real: 真实 WAMR，需预编译 libvmlib.a
#   - wamr-stub: 零依赖回退，无实际执行能力
runtime:
  max-components: 32
  max-memory-per-instance: 64
  implementation: wamr-real

# 最小启动配置
bootstrap:
  mode: minimal
  log-level: info
  first-component: wasm-runtime